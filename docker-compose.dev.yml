services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastwrite
      POSTGRES_USER: fastwrite
      POSTGRES_PASSWORD: fastwrite-dev-only
    ports: ["5432:5432"]
    volumes: ["fastwrite-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fastwrite
      MINIO_ROOT_PASSWORD: fastwrite-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["fastwrite-minio:/data"]
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
volumes:
  fastwrite-postgres:
  fastwrite-minio:
