name: Validate and deploy FastWrite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: validate-fastwrite-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - name: Checkout pinned FastDeploy packager
        uses: actions/checkout@v4
        with:
          repository: FastR-D/FastDeploy
          ref: cc223a0b83b0ef2389974dd70a4b74148cd1af87
          path: .fastdeploy-tools
          persist-credentials: false
      - name: Package the tested runtime
        run: python3 .fastdeploy-tools/scripts/package.py fastwrite --output "$RUNNER_TEMP/fastwrite-release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/fastwrite-release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: FastR-D/FastDeploy/.github/workflows/deploy.yml@cc223a0b83b0ef2389974dd70a4b74148cd1af87
    with:
      app: fastwrite
      artifact-name: release-${{ github.sha }}
      # These values are literal KEY=value entries; do not add shell quotes.
      # Code-relative paths are supplied by the trusted FastDeploy server profile.
      runtime-env: |
        FASTWRITE_ALLOW_LEGACY_API_KEYS=false
        FASTWRITE_DATA_DIR=/home/dev/fastwrite-shared/data
        FASTWRITE_FASTCAS_ALLOW_SIGNUP=false
        FASTWRITE_FASTCAS_CLIENT_ID=fastwrite
        FASTWRITE_FASTCAS_ISSUER=https://cas.fastrd.io
        FASTWRITE_FASTCAS_LOOPBACK_HTTP=false
        FASTWRITE_FASTCAS_REDIRECT_URI=https://fastrd.io/write/api/auth/fastcas/callback
        FASTWRITE_FASTCAS_SERVICE_ALLOWED_CLIENT_IDS=fastresearch
        FASTWRITE_FASTCAS_SERVICE_ALLOW_LOOPBACK_HTTP=false
        FASTWRITE_FASTCAS_SERVICE_AUDIENCE=fastwrite-api
        FASTWRITE_FASTCAS_SERVICE_CLIENT_ID=fastwrite-api
        FASTWRITE_FASTCAS_SERVICE_ENABLED=true
        FASTWRITE_FASTCAS_SERVICE_ISSUER=https://cas.fastrd.io
        FASTWRITE_HARNESS=codex
        FASTWRITE_HARNESS_BASE_URL=https://xiaoqie.xyz/
        FASTWRITE_HARNESS_MODEL=gpt-6-astra
        FASTWRITE_PORT=3003
        FASTWRITE_SERVER_AUTH=true
        PATH=/home/dev/fastwrite-shared/bin:/home/dev/fastwrite-shared/runtime/bun-linux-x64:/home/dev/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
        XDG_CACHE_HOME=/home/dev/fastwrite-shared/cache
    secrets:
      SSH_HOST: ${{ secrets.FASTRD_SSH_HOST }}
      SSH_PORT: ${{ secrets.FASTRD_SSH_PORT }}
      SSH_USER: ${{ secrets.FASTRD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.FASTRD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.FASTRD_SSH_KNOWN_HOSTS }}
      runtime-secrets: |
        {
          "FASTWRITE_FASTCAS_CLIENT_SECRET": ${{ toJSON(secrets.FASTWRITE_FASTCAS_CLIENT_SECRET) }}
        }
